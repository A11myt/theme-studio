# Baut die Desktop-App für Windows und Linux.
# - bei jedem Push auf main: Installer als Artefakt (Actions → Lauf → „Artifacts“)
# Releases mit automatischen Updates: siehe release.yml (Tags v*)
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis,msi
            artifact: windows
          - os: ubuntu-22.04
            bundles: deb,appimage
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux-Pakete für Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # Das WebAssembly-Modul (src/wasm) liegt fertig im Repo – kein wasm-Build nötig.
      - name: App bauen
        run: pnpm tauri build --bundles ${{ matrix.bundles }}

      # Windows ohne Installation: das Programm selbst – Oberfläche ist eingebaut, WebView2 bringt Windows 11 mit
      - name: Portable .exe
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p portable
          cp src-tauri/target/release/theme-studio.exe "portable/Theme-Studio-portable.exe"

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: theme-studio-windows-portable
          path: portable/Theme-Studio-portable.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: theme-studio-${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
